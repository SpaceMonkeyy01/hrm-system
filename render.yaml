# Render Blueprint for the HRM System. Step by step: docs/DEPLOY-Render.md.
# "sync: false" values are secrets: Render asks for them when the Blueprint is first applied and never stores
# them in this file.
services:
  - type: web
    name: hrm-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_NAME
        value: HRM System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY            # php artisan key:generate --show
        sync: false
      - key: APP_URL            # e.g. https://hrm-system.onrender.com
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Database: a free Postgres that doesn't expire (Neon or Supabase). Paste its connection string.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL             # postgresql://user:password@host/dbname?sslmode=require
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Uploaded scans, photos and signed leave forms: a private Cloudflare R2 bucket (the free instance has no
      # lasting disk). AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are set in Render > Environment only, never here.
      - key: HRM_FILES_ENABLED
        value: "true"
      - key: HRM_FILES_DISK
        value: s3
      - key: AWS_BUCKET
        value: hrm-files
      - key: AWS_ENDPOINT
        value: https://24fd007d621bafdf7172e869c380803a.r2.cloudflarestorage.com
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Email (reminders, staff login invites, forgotten passwords) through Resend's web API: Render free blocks the
      # SMTP ports. RESEND_API_KEY from resend.com > API Keys; MAIL_FROM_ADDRESS on the domain verified there.
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: HRM System

      # Attendance machines are kept in the app (Attendance > Devices). ZK_* only seed the first device once, on upgrade
      # from the single-machine version; new installs leave them empty.
      - key: ZK_HOST            # the office's static IP
        sync: false
      - key: ZK_PORT
        value: "4370"
      - key: ZK_COMM_KEY        # Comm. > Comm Key on the machine
        sync: false
      # Clock in on the My page: a clock-in from these IPs is office time (the office static IP; comma-separated)
      - key: HRM_OFFICE_IPS
        sync: false

      # Secret for the daily reminder URL that cron-job.org opens: /cron/reminders/<CRON_TOKEN>
      - key: CRON_TOKEN
        generateValue: true
